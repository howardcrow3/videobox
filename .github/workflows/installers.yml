name: Installers

# Builds the macOS .dmg and Windows .msi/.zip for VideoBox on GitHub's standard runners.
# No secrets are required: macOS is ad-hoc signed and Windows is unsigned. To sign, add the
# optional secrets listed at the bottom of this file under Settings > Secrets and variables > Actions.
# Run it from the Actions tab (Run workflow) or by pushing a tag like v0.1.0.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package (universal dmg)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: videobox-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Package (msi + portable zip)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: videobox-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*

# Optional secrets (all unset = unsigned builds):
#   macOS:   MACOS_SIGN_IDENTITY (a Developer ID certificate must already be in the runner keychain),
#            APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID for notarization
#   Windows: see packaging/windows/sign.ps1
