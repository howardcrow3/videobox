[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/howardcrow3/videobox"

[workspace.dependencies]
# internal
videobox-time = { path = "crates/time" }
videobox-geom = { path = "crates/geom" }
videobox-color = { path = "crates/color" }
videobox-bitstream = { path = "crates/bitstream" }
videobox-isobmff = { path = "crates/isobmff" }
videobox-avi = { path = "crates/avi" }
videobox-matroska = { path = "crates/matroska" }
videobox-mxf = { path = "crates/mxf" }
videobox-cfb = { path = "crates/cfb" }
videobox-mpegts = { path = "crates/mpegts" }
videobox-mpeg2v = { path = "crates/mpeg2v" }
videobox-ac3 = { path = "crates/ac3" }
videobox-mpa = { path = "crates/mpa" }
videobox-ogg = { path = "crates/ogg" }
videobox-h264 = { path = "crates/h264" }
videobox-hevc = { path = "crates/hevc" }
videobox-vp8 = { path = "crates/vp8" }
videobox-vp9 = { path = "crates/vp9" }
videobox-prores = { path = "crates/prores" }
videobox-dnx = { path = "crates/dnx" }
videobox-apv = { path = "crates/apv" }
videobox-dng = { path = "crates/dng" }
videobox-av1 = { path = "crates/av1" }
videobox-aac = { path = "crates/aac" }
videobox-flac = { path = "crates/flac" }
videobox-opus = { path = "crates/opus" }
videobox-h264enc = { path = "crates/h264enc" }
videobox-audio-dsp = { path = "crates/audio-dsp" }
videobox-frame = { path = "crates/frame" }
videobox-media = { path = "crates/media" }
videobox-codecs = { path = "crates/codecs" }
videobox-project = { path = "crates/project" }
videobox-edit = { path = "crates/edit" }
videobox-interchange = { path = "crates/interchange" }
videobox-text = { path = "crates/text" }
videobox-captions = { path = "crates/captions" }
videobox-speech = { path = "crates/speech" }
videobox-tts = { path = "crates/tts" }
videobox-tts-text = { path = "crates/tts-text" }
videobox-render = { path = "crates/render" }
videobox-gpu = { path = "crates/gpu" }
videobox-scopes = { path = "crates/scopes" }
videobox-export = { path = "crates/export" }
videobox-format = { path = "crates/format" }
videobox-engine = { path = "crates/engine" }
videobox-ui-egui = { path = "crates/ui-egui" }
videobox-automation = { path = "crates/automation" }
videobox-platform = { path = "crates/platform" }
videobox-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "f0ad6c1e1d297908915f4be315b0fcfc9be7b5d4", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.videobox-h264]
opt-level = 3

[profile.dev.package.videobox-h264enc]
opt-level = 3

[profile.dev.package.videobox-hevc]
opt-level = 3

[profile.dev.package.videobox-prores]
opt-level = 3

[profile.dev.package.videobox-dnx]
opt-level = 3

[profile.dev.package.videobox-apv]
opt-level = 3

[profile.dev.package.videobox-dng]
opt-level = 3

[profile.dev.package.videobox-av1]
opt-level = 3

[profile.dev.package.videobox-aac]
opt-level = 3

[profile.dev.package.videobox-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.videobox-audio-dsp]
opt-level = 3

[profile.dev.package.videobox-mxf]
opt-level = 3

[profile.dev.package.videobox-opus]
opt-level = 3

[profile.dev.package.videobox-vp8]
opt-level = 3

[profile.dev.package.videobox-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
