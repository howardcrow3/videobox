[package]
name = "videobox-cli"
description = "VideoBox headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "videobox-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["videobox-engine/whisper", "videobox-engine/speech-download"]

[dependencies]
videobox-engine = { workspace = true }
videobox-export = { workspace = true }
videobox-project = { workspace = true }
videobox-render = { workspace = true }
videobox-time = { workspace = true }
videobox-gpu = { workspace = true }
videobox-media = { workspace = true }
videobox-codecs = { workspace = true }
videobox-platform = { workspace = true }
videobox-mxf = { workspace = true }
videobox-mpegts = { workspace = true }
videobox-ogg = { workspace = true }
videobox-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
videobox-testkit = { workspace = true }
