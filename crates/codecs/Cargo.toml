[package]
name = "videobox-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
videobox-time = { workspace = true }
videobox-color = { workspace = true }
videobox-frame = { workspace = true }
videobox-media = { workspace = true }
videobox-avi = { workspace = true }
videobox-isobmff = { workspace = true }
videobox-matroska = { workspace = true }
videobox-mxf = { workspace = true }
videobox-mpegts = { workspace = true }
videobox-mpeg2v = { workspace = true }
videobox-ac3 = { workspace = true }
videobox-mpa = { workspace = true }
videobox-ogg = { workspace = true }
videobox-bitstream = { workspace = true }
videobox-h264 = { workspace = true }
videobox-hevc = { workspace = true }
videobox-vp8 = { workspace = true }
videobox-vp9 = { workspace = true }
videobox-prores = { workspace = true }
videobox-dnx = { workspace = true }
videobox-av1 = { workspace = true }
videobox-apv = { workspace = true }
videobox-aac = { workspace = true }
videobox-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
videobox-testkit = { workspace = true }
serde_json = { workspace = true }
