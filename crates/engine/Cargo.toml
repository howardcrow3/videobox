[package]
name = "videobox-engine"
description = "VideoBox engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["videobox-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["videobox-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["videobox-tts/kokoro", "speech-download"]

[dependencies]
videobox-time = { workspace = true }
videobox-geom = { workspace = true }
videobox-color = { workspace = true }
videobox-frame = { workspace = true }
videobox-media = { workspace = true }
videobox-codecs = { workspace = true }
videobox-project = { workspace = true }
videobox-edit = { workspace = true }
videobox-render = { workspace = true }
videobox-scopes = { workspace = true }
videobox-text = { workspace = true }
videobox-audio-dsp = { workspace = true }
videobox-export = { workspace = true }
videobox-mxf = { workspace = true }
videobox-format = { workspace = true }
videobox-interchange = { workspace = true }
videobox-captions = { workspace = true }
videobox-speech = { workspace = true }
videobox-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
videobox-testkit = { workspace = true }
videobox-dng = { workspace = true, features = ["writer"] }
videobox-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
