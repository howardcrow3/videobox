[package]
name = "videobox-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
videobox-time = { workspace = true }
videobox-frame = { workspace = true }
videobox-color = { workspace = true }
videobox-media = { workspace = true }
videobox-project = { workspace = true }
videobox-render = { workspace = true }
videobox-audio-dsp = { workspace = true }
videobox-geom = { workspace = true }
videobox-text = { workspace = true }
videobox-isobmff = { workspace = true }
videobox-prores = { workspace = true }
videobox-dnx = { workspace = true }
videobox-apv = { workspace = true }
videobox-mxf = { workspace = true }
videobox-aac = { workspace = true }
videobox-flac = { workspace = true }
videobox-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
videobox-testkit = { workspace = true }
videobox-codecs = { workspace = true }
