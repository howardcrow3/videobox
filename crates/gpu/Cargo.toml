[package]
name = "videobox-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
videobox-color = { workspace = true }
videobox-frame = { workspace = true }
videobox-geom = { workspace = true }
videobox-project = { workspace = true }
videobox-render = { workspace = true }
videobox-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
videobox-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
videobox-media = { workspace = true }
videobox-time = { workspace = true }
