[package]
name = "videobox-ui-egui"
description = "The VideoBox egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
videobox-time = { workspace = true }
videobox-geom = { workspace = true }
videobox-color = { workspace = true }
videobox-frame = { workspace = true }
videobox-media = { workspace = true }
videobox-project = { workspace = true }
videobox-tts = { workspace = true }
videobox-edit = { workspace = true }
videobox-render = { workspace = true }
videobox-text = { workspace = true }
videobox-audio-dsp = { workspace = true }
videobox-engine = { workspace = true }
videobox-export = { workspace = true }
videobox-gpu = { workspace = true }
videobox-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# Turtle Box wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "1.0"
videobox-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
videobox-platform = { workspace = true }
videobox-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
